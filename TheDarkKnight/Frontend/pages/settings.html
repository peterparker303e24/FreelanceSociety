<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
    <base href="../">
    <link rel="icon" href="./favicons/favicon.ico" type="image/x-icon">
    <link rel="icon" href="./favicons/favicon-16x16.png" type="image/png" sizes="16x16">
    <link rel="icon" href="./favicons/favicon-32x32.png" type="image/png" sizes="32x32">
    <link rel="icon" href="./favicons/android-chrome-192x192.png" sizes="192x192">
    <link rel="icon" href="./favicons/android-chrome-512x512.png" sizes="512x512">
    <link rel="apple-touch-icon" href="./favicons/apple-touch-icon.png">
    <link rel="stylesheet" href="./global.css">
    <link rel="stylesheet" href="./css/settings.css">
    <script src="./js/applyDarkModePreference.js" type="module"></script>
    <script src="./js/settings.js" type="module" defer></script>
    <script src="./js/components/headerSection.js" type="module"></script>
    <script src="./js/components/helpSection.js" type="module"></script>
</head>

<body>
    <div class="vertical-scroll">

        <!-- Header section -->
        <div id="header-container">
            <header-section headerText="Settings"></header-section>
        </div>

        <!-- Group items into left and right columns -->
        <div class="key-value-settings-grid">

            <!-- Light/dark mode -->
            <div class="left-column row vertically-center-row">
                <div id="mode-button" class="left-column icon-button">
                    <img id="mode-button-svg" src="./assets/icons/LightMode.svg" class="icon" />
                    <div id="mode-icon-text" class="icon-text">Light Mode</div>
                </div>
            </div>

            <div id="toggle-button" class="border-button left medium-padding medium-height">Toggle: Light Mode</div>
            
            <!-- Blockchain data -->
            <div class="left-column row vertically-center-row">
                <div id="blockchain-data-icon" class="icon-button large-margin">
                    <img id="blockchain-data-icon-svg" src="./assets/icons/EthereumLogo.svg" class="icon" />
                    <div id="blockchain-data-icon-text" class="icon-text">Blockchain<br>Data</div>
                </div>
            </div>

            <div>
                <div class="row">
                    <textarea id="blockchain-data-input" class="left xxx-large-width xx-large-height left"></textarea>
                </div>
                <div class="row-left">
                    <div id="blockchain-data-error" class="medium-margin-vertical hide"></div>
                </div>
                <div class="row">
                    <div id="blockchain-data-save-button" class="border-button medium-padding medium-margin-vertical medium-text xx-large-width left">Save Blockchain Data</div>
                </div>
            </div>
    
            <!-- Ethereum value display type -->
            <div class="left-column row vertically-center-row">
                <div id="blockchain-data-icon" class="icon-button large-margin">
                    <img class="eth-display-type-image icon" id="blockchain-data-icon-svg" src="./assets/icons/EthereumLogo.svg" />
                    <div class="eth-display-type-subtext icon-text">Ethereum Value<br>Display Type</div>
                </div>
            </div>

            <select class="eth-display-type medium-padding x-large-width left medium-text large-height">
                <option value="eth">ETH</option>
                <option value="wei">Wei</option>
            </select>
    
            <!-- Show help button toggle -->
            <div>
                <div class="large-text">?</div>
                <div class="large-margin">Show Help Button</div>
            </div>
            
            <div class="show-help-button-toggle border-button left medium-padding medium-height">Toggle: Show Help Button</div>
        </div>
        
        <!-- Help -->
        <div id="help-container">
            <help-section helpCollection="Settings"></help-section>
        </div>
        
        <!-- Footer space -->
        <div id="footer-space"></div>
    </div>
</body>

</html>
